name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_args: --win
          - os: macos-latest
            build_args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # DeepFilterNet3 原生库：各平台从源码编译（产物按平台命名进 vendor/deep-filter/，
      # electron-builder 经 files.vendor/** 打进安装包；缺失时应用自动回退 RNNoise）
      - name: Clone DeepFilterNet
        shell: bash
        run: git clone --depth 1 https://github.com/Rikorose/DeepFilterNet.git "$RUNNER_TEMP/dfn"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/dfn/libDF

      - name: Build DFN lib (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p deep_filter --features capi --no-default-features \
            --manifest-path "$RUNNER_TEMP/dfn/libDF/Cargo.toml"
          mkdir -p vendor/deep-filter
          cp "$RUNNER_TEMP/dfn/target/release/df.dll" vendor/deep-filter/

      - name: Build DFN lib (macos universal2)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release -p deep_filter --features capi --no-default-features \
              --manifest-path "$RUNNER_TEMP/dfn/libDF/Cargo.toml" --target $t
          done
          mkdir -p vendor/deep-filter
          lipo -create -output vendor/deep-filter/libdf.dylib \
            "$RUNNER_TEMP/dfn/target/x86_64-apple-darwin/release/libdf.dylib" \
            "$RUNNER_TEMP/dfn/target/aarch64-apple-darwin/release/libdf.dylib"
          file vendor/deep-filter/libdf.dylib

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec electron-builder ${{ matrix.build_args }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RK87-AIKey-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
